    <div class="container">

      <a href="home.html"><button id="logo-button"></button></a>
      <div class="title">Contact</div>
      <div class="contact-container">

        <div class="contact-left">
          <div class="contact-text">
            <form action="https://formspree.io/f/mbgdkkpb" method="POST">
              <label for="name">Name:</label><br>
              <input type="text" id="name" name="name" required><br>

              <label for="email">Email:</label><br>
              <input type="email" id="email" name="email" required><br>

              <label for="message">Message:</label><br>
              <textarea class="message" id="message" name="message" placeholder="Message..." required></textarea><br>
              <button type="submit" id="contact-button">Send</button>
            </form>
          </div>
        </div>

        <div class="contact-right">
          <div class="contact-text">
            <li> Or you can can contact me via: </li>
            <li>
              <a href = "https://www.linkedin.com/in/francisco-portilha-53504123a/">LinkedIn</a>
            </li>
            <li>
              <a href = "https://github.com/FranciscoPortilha">GitHub</a>
            </li>
            <li>
              <a href = "mailto:portilhafr@gmail.com">Email</a>
            </li>
          </div>
        </div> 
      </div>
    </div>
    <script src="../src/app.js"></script>
